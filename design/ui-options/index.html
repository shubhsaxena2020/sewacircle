<!doctype html><meta charset="utf-8"><title>SewaCircle UI options</title>
<style>body{margin:0;font:14px system-ui;background:#111;color:#eee}header{position:sticky;top:0;background:#111;padding:10px 16px;border-bottom:1px solid #333;z-index:2}
h1{font-size:16px;margin:0 0 8px}button{background:#222;color:#ddd;border:1px solid #444;border-radius:6px;padding:6px 10px;margin:2px;cursor:pointer;text-transform:capitalize}button.on{background:#e8e8e8;color:#111}
main{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:14px}figure{margin:0;background:#1b1b1b;border-radius:8px;overflow:hidden}figcaption{padding:8px 10px}figcaption a{color:#8ab4ff;float:right}
.shot img{width:100%;display:block;max-height:900px;object-fit:cover;object-position:top}label{margin-left:12px}</style>
<header><h1>SewaCircle Ready Crew &mdash; 8 UI directions (click an image to open it full size)</h1><button data-p="01-landing">landing</button><button data-p="02-console-task">console task</button><button data-p="03-console-roles">console roles</button><button data-p="04-console-crew-ready">console crew ready</button><button data-p="05-console-crew-not-ready">console crew not ready</button><button data-p="06-console-evidence">console evidence</button><button data-p="07-console-ledger">console ledger</button><button data-p="08-console-evaluation">console evaluation</button><button data-p="09-volunteer">volunteer</button><button data-p="10-districts">districts</button><button data-p="11-method">method</button><label><input type="checkbox" id="full"> show full page height</label></header><main><figure data-o="01-precision-dark"><figcaption><b>01</b> Precision dark <a href="01-precision-dark/screens/" target="_blank">all pages</a></figcaption><a class="shot" target="_blank"><img loading="lazy"></a></figure><figure data-o="02-premium-gradient"><figcaption><b>02</b> Premium gradient <a href="02-premium-gradient/screens/" target="_blank">all pages</a></figcaption><a class="shot" target="_blank"><img loading="lazy"></a></figure><figure data-o="03-field-notebook"><figcaption><b>03</b> Field notebook <a href="03-field-notebook/screens/" target="_blank">all pages</a></figcaption><a class="shot" target="_blank"><img loading="lazy"></a></figure><figure data-o="04-community-warm"><figcaption><b>04</b> Community warm <a href="04-community-warm/screens/" target="_blank">all pages</a></figcaption><a class="shot" target="_blank"><img loading="lazy"></a></figure><figure data-o="05-minimal-keynote"><figcaption><b>05</b> Minimal keynote <a href="05-minimal-keynote/screens/" target="_blank">all pages</a></figcaption><a class="shot" target="_blank"><img loading="lazy"></a></figure><figure data-o="06-civic-newsroom"><figcaption><b>06</b> Civic newsroom <a href="06-civic-newsroom/screens/" target="_blank">all pages</a></figcaption><a class="shot" target="_blank"><img loading="lazy"></a></figure><figure data-o="07-ops-whiteboard"><figcaption><b>07</b> Ops whiteboard <a href="07-ops-whiteboard/screens/" target="_blank">all pages</a></figcaption><a class="shot" target="_blank"><img loading="lazy"></a></figure><figure data-o="08-mitti-original"><figcaption><b>08</b> Mitti (original) <a href="08-mitti-original/screens/" target="_blank">all pages</a></figcaption><a class="shot" target="_blank"><img loading="lazy"></a></figure></main>
<script>const b=[...document.querySelectorAll('header button')];function show(p){b.forEach(x=>x.classList.toggle('on',x.dataset.p===p));document.querySelectorAll('figure').forEach(f=>{const s=f.dataset.o+'/screens/'+p+'.png';f.querySelector('img').src=s;f.querySelector('.shot').href=s})}
b.forEach(x=>x.onclick=()=>show(x.dataset.p));document.getElementById('full').onchange=e=>document.querySelectorAll('.shot img').forEach(i=>i.style.maxHeight=e.target.checked?'none':'900px');show('04-console-crew-ready')</script>
